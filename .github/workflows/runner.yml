name: Autofill Runner

on:
  push:
    branches: [main] # first tick fires immediately on repo creation — no manual "Run workflow" click
  schedule:
    # Every 5 minutes (GitHub's minimum). Public repos = unlimited free minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # manual trigger from the Actions tab

jobs:
  poll:
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5, 6, 7, 8]
    concurrency:
      group: autofill-runner-${{ matrix.worker }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install runner deps
        working-directory: automation
        run: bun install --frozen-lockfile || bun install

      - name: Install Playwright browsers
        working-directory: automation
        run: bunx playwright install --with-deps chromium

      - name: Poll for queued sessions (max 8 min, then exit for next cron tick)
        working-directory: automation
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          RUNNER_SHARED_SECRET: ${{ secrets.RUNNER_SHARED_SECRET }}
          RUNNER_ID: github-${{ github.run_id }}-${{ matrix.worker }}
          RUNNER_HEADLESS: "1"
          RUNNER_RUN_BUDGET_MS: "440000"
        run: |
          # Preserve failures so watchdog diagnostics can distinguish a healthy
          # drain from a crashed browser instead of reporting a false success.
          timeout --preserve-status 480 bun run autofill-runner.ts
